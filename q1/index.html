<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Lab 4a Question 1 - Interactive Text Changer. Click a button to replace a paragraph using JavaScript DOM manipulation.">
    <meta name="author" content="Tan Yue Heng (AI240167)">
    <title>Q1 &mdash; Interactive Text Changer | Lab 4a</title>

    <link rel="stylesheet" href="../shared/style.css">
</head>

<body>
<div class="wrap">

    <a class="back-link" href="../index.html">&larr; Back to Lab 4a home</a>

    <main class="card">
        <span class="eyebrow">Lab 4a &middot; Question 1</span>
        <h1>Interactive Text Changer</h1>
        <p class="lede">
            The paragraph below starts with a welcome message. Press
            <strong>Change Message</strong> and JavaScript replaces its text with
            &ldquo;Hello there!&rdquo;.
        </p>

        <hr class="divider">

        <!-- Required starting markup -->
        <div id="myElement">
            <p id="message">Welcome to my website!</p>
        </div>
        <button id="changeBtn" type="button">Change Message</button>

        <!-- Visible status region for accessibility -->
        <p id="status" role="status" aria-live="polite">
            Waiting for you to press the button&hellip;
        </p>
    </main>

</div>

<!-- defer keeps the DOM ready before the script runs -->
<script src="q1.js" defer></script>
</body>
</html>
